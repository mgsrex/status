# Upptime config for status.tyrantrepublic.io
# Docs: https://upptime.js.org/docs/configuration

owner: mgsrex
repo: status

# Custom domain -- generates a CNAME file automatically on build
domain: status.tyrantrepublic.io

name: EPYON Status
introTitle: "## EPYON"
introMessage: >
  Live status for Plex and the media automation stack.
  Checked automatically every 5 minutes.

# logo: https://your-assets/carcosa-logo.png   # add once you have the image hosted

sites:
  - name: Plex
    url: https://plex.tyrantrepublic.io/identity   # unauthenticated health endpoint
    icon: plex

  - name: Seerr
    url: https://requests.tyrantrepublic.io
    icon: overseerr

  - name: Sonarr
    url: https://sonarr.tyrantrepublic.io
    icon: sonarr

  - name: Radarr
    url: https://radarr.tyrantrepublic.io
    icon: radarr

  - name: Bazarr
    url: https://bazarr.tyrantrepublic.io
    icon: bazarr

  - name: Prowlarr
    url: https://prowlarr.tyrantrepublic.io
    icon: prowlarr

  - name: qBittorrent
    url: https://qbittorrent.tyrantrepublic.io
    icon: qbittorrent

# Check interval in minutes (default 5)
# checkInterval: 5

# Assign each site a status page category if you want grouping later